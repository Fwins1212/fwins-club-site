<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Membership | Fwins Club</title><style>
body{margin:0;background:#eff6ff;color:#172554;font:16px system-ui}main{max-width:580px;margin:40px auto;padding:28px;background:white;border-radius:20px;box-shadow:0 12px 40px #1e40af15}a{color:#1d4ed8}h1{font-size:32px}label{display:block;margin:18px 0 7px}input,select,button{box-sizing:border-box;width:100%;padding:13px;border:1px solid #bfdbfe;border-radius:9px;font:inherit}button{background:#1d4ed8;color:white;cursor:pointer;margin-top:20px}button:disabled{opacity:.5}#status{white-space:pre-line;padding:14px 0;line-height:1.5}small{display:block;color:#475569;line-height:1.6;margin-top:14px}@media(max-width:620px){main{margin:16px;padding:22px}}
</style></head><body><main><a href="/">← Fwins Club</a><h1>Join your future network</h1><p>Choose your membership. Sign in or create an account, then pay securely with Razorpay.</p>
<label for="plan">Membership plan</label><select id="plan"><option value="1 Year">Starter — ₹99 / 1 year</option><option value="5 Years">Growth — ₹349 / 5 years</option><option value="Lifetime">Legacy — ₹499 / lifetime</option></select>
<section id="auth"><form id="auth-form"><label for="name">Full name (for new accounts)</label><input id="name" autocomplete="name"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required><button id="login" type="submit">Sign in</button><button id="signup" type="button">Create account</button></form></section>
<section id="member" hidden><p id="identity"></p><button id="pay">Continue to secure payment</button><button id="refresh">Check membership status</button><button id="logout">Sign out</button></section><div id="status" role="status" aria-live="polite"></div><small>Membership payments are one-time payments; no automatic renewal. Your membership activates after payment verification. Questions or refund requests: <a href="mailto:info.fwins@gmail.com">info.fwins@gmail.com</a>.</small></main><script type="module" src="/membership.js"></script></body></html>
